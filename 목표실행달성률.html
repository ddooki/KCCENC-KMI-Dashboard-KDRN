<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>목표실행달성률</title>
<style>
  :root{
    --bg:#35423e; --card:#404f4a; --deep:#2b3733; --text:#f0f4f2; --sub:#aab9b1; --border:#55665e;
    --plan:#7e93ab; --actual:#8cb269; --miss:#ff6969; --amber:#ffad42;
    --ok:#8cb269; --warn:#ffad42; --danger:#ff6969;
    --c-rail:#78add6; --c-road:#e8934e; --c-devel:#8cb269; --c-etc:#bd8bd4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 32px 60px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:22px}
  .head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .head .sub{color:var(--sub);font-size:13px;margin-top:5px}
  .head .asof{color:var(--sub);font-size:12px;text-align:right;white-space:nowrap}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .sectabs{display:flex;gap:10px;margin-bottom:20px}
  .sectab{flex:0 0 auto;padding:11px 26px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-weight:700;font-size:15px;cursor:pointer;transition:all .15s}
  .sectab.on{background:linear-gradient(180deg,rgba(255,173,66,.14),rgba(255,173,66,.03));border-color:var(--amber);color:var(--text)}
  .sectab .n{font-size:12px;color:var(--sub);font-weight:600;margin-left:8px}
  .summary{background:var(--deep);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .summary .stit{font-size:13px;color:var(--sub);font-weight:700}
  .flow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .fnode{text-align:center;min-width:78px}
  .fnode .lbl{font-size:11px;color:var(--sub);margin-bottom:3px}
  .fnode .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .farrow{color:var(--sub);font-size:20px}
  .fdelta{margin-left:6px;padding:5px 12px;border-radius:9px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .dist{display:flex;gap:8px;margin-left:auto;align-items:center}
  .chip{display:flex;flex-direction:column;align-items:center;min-width:60px;padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
  .chip .c-n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .chip .c-l{font-size:10.5px;color:var(--sub);margin-top:1px}
  .chip.ok .c-n{color:var(--ok)} .chip.warn .c-n{color:var(--warn)} .chip.danger .c-n{color:var(--danger)}
  .scount{font-size:12px;color:var(--sub);text-align:right;min-width:110px}
  .chartcard{background:var(--deep);border:1px solid var(--border);border-radius:14px;padding:16px 20px 12px;margin-bottom:24px}
  .chartcard .clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:6px;align-items:center}
  .chartcard .clegend .sw{display:inline-flex;align-items:center;gap:6px}
  .chartcard .cap{font-size:11.5px;color:var(--sub);margin-top:4px}
  .group{margin-bottom:22px;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--card)}
  .ghead{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--deep);cursor:pointer;user-select:none}
  .ghead .gname{font-size:16px;font-weight:800}
  .ghead .gn{font-size:12px;color:var(--sub);font-weight:600}
  .ghead .gagg{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:12px;color:var(--sub)}
  .ghead .gagg b{font-size:15px;font-variant-numeric:tabular-nums;margin-left:5px}
  .ghead .caret{color:var(--sub);transition:transform .18s;font-size:12px}
  .group.collapsed .caret{transform:rotate(-90deg)}
  .group.collapsed table{display:none}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:11px;color:var(--sub);font-weight:700;text-align:right;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  thead th.l{text-align:left}
  tbody td{padding:9px 14px;border-bottom:1px solid rgba(85,102,94,.4);text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  td.name{text-align:left;font-weight:600;color:var(--text)}
  .rate{font-weight:700}
  .rate.ok{color:var(--ok)} .rate.warn{color:var(--warn)} .rate.danger{color:var(--danger)}
  .plan-v{color:var(--plan);font-weight:700}
  .blank{color:var(--sub);opacity:.5}
  .badge-new{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;color:#241c0c;background:var(--amber);padding:2px 7px;border-radius:5px;vertical-align:middle}
  .delta{font-weight:800}
  .delta.up{color:var(--danger)} .delta.down{color:var(--actual)} .delta.flat{color:var(--sub)}
  .gap-sub{font-size:11px;color:var(--sub)}
  .note{margin-top:26px;font-size:12px;color:var(--sub);line-height:1.7;border-top:1px solid var(--border);padding-top:16px}
  @media(max-width:720px){ .wrap{padding:18px} thead th.hide,td.hide{display:none} .summary{gap:14px} .dist{margin-left:0} }
</style></head>

  <div class="head">
    <div>
      <h1>목표실행달성률</h1>
      <div class="sub">현장별 실행율 비교 — 투찰(기준) · 사업계획 · 준공추정 &nbsp;|&nbsp; 도급 · 실행(본사관리비 반영) 기준</div>

  <div class="sectabs" id="sectabs"></div>

  </div>
</div>

function agg(list, dK, sK){
  let d=0,s=0,any=false;
  list.forEach(x=>{ if(x[dK]!=null && x[sK]!=null){ d+=x[dK]; s+=x[sK]; any=true; } });
  return (any && d) ? (s/d*100) : null;
}
function deltaCell(v){

}

function marker(shape,cx,cy,col,title){
  const t = title? '<title>'+title+'</title>' : '';
  const st='fill:'+col+';stroke:#2b3733;stroke-width:1;opacity:.92';
  if(shape==="c") return '<circle cx="'+cx+'" cy="'+cy+'" r="5.5" style="'+st+'">'+t+'</circle>';

  if(shape==="s") return '<rect x="'+(cx-5)+'" y="'+(cy-5)+'" width="10" height="10" style="'+st+'">'+t+'</rect>';
  return '<polygon points="'+cx+','+(cy-6.5)+' '+(cx+6)+','+cy+' '+cx+','+(cy+6.5)+' '+(cx-6)+','+cy+'" style="'+st+'">'+t+'</polygon>';

  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" role="img" aria-label="투찰 대 준공추정 실행율 산점도">';
  s+='<rect x="'+mL+'" y="'+mT+'" width="'+(W-mL-mR)+'" height="'+(H-mT-mB)+'" fill="none" stroke="var(--border)"/>';

    s+='<line x1="'+mL+'" y1="'+Y(t)+'" x2="'+(W-mR)+'" y2="'+Y(t)+'" stroke="rgba(85,102,94,.5)"/>';
    s+='<text x="'+X(t)+'" y="'+(H-mB+16)+'" fill="var(--sub)" font-size="11" text-anchor="middle">'+t+'</text>';
    s+='<text x="'+(mL-8)+'" y="'+(Y(t)+4)+'" fill="var(--sub)" font-size="11" text-anchor="end">'+t+'</text>';
  });
  s+='<line x1="'+X(lo)+'" y1="'+Y(lo)+'" x2="'+X(hi)+'" y2="'+Y(hi)+'" stroke="var(--sub)" stroke-dasharray="5,5" stroke-width="1"/>';
  s+='<text x="'+(X(118))+'" y="'+(Y(118)-6)+'" fill="var(--sub)" font-size="10.5" text-anchor="end">투찰=준공</text>';
  list.forEach(d=>{
    if(d.투찰율==null||d.준공율==null) return;

  s+='<text transform="translate(14,'+((mT+H-mB)/2)+') rotate(-90)" fill="var(--sub)" font-size="12" text-anchor="middle">준공추정 실행율 (%)</text>';

function distChips(list){
  let ok=0,wa=0,da=0;
  list.forEach(s=>{ if(s.준공율==null)return; if(s.준공율>=100)da++; else if(s.준공율>=95)wa++; else ok++; });
  return '<div class="dist">'
    + '<div class="chip danger"><span class="c-n">'+da+'</span><span class="c-l">경보 100↑</span></div>'
    + '<div class="chip warn"><span class="c-n">'+wa+'</span><span class="c-l">주의 95~100</span></div>'
    + '<div class="chip ok"><span class="c-n">'+ok+'</span><span class="c-l">양호 &lt;95</span></div>'
    + '</div>';
}

      + '<span class="fdelta" style="background:'+dbg(dBA)+';color:'+dcol(dBA)+'">준공−투찰 '+(dBA==null?"—":(dBA>0?"+":"")+dBA.toFixed(1))+'p</span>'
      + '</div>' + distChips(ss) + '</div>';
  html+='<div class="scount" style="text-align:left;margin:-6px 4px 14px;">현장 '+ss.length+'개 · 사업계획 매칭 '+matched.length+' · 신규수주 '+(ss.length-matched.length)+'</div>';
  // 산점도 카드
  html+='<div class="chartcard"><div class="clegend">'
      + '<span class="sw"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--c-rail)"/></svg>'+ORDER[CUR][0]+'</span>'
      + '<span class="sw"><svg width="14" height="14"><polygon points="7,1 13,12 1,12" fill="var(--c-road)"/></svg>'+ORDER[CUR][1]+'</span>'
      + '<span class="sw"><svg width="14" height="14"><rect x="2" y="2" width="10" height="10" fill="var(--c-devel)"/></svg>'+ORDER[CUR][2]+'</span>'
      + '<span class="sw"><svg width="14" height="14"><polygon points="7,1 13,7 7,13 1,7" fill="var(--c-etc)"/></svg>기타</span>'
      + '<span style="margin-left:auto;color:var(--sub)">점선(투찰=준공) 아래로 내려갈수록 준공추정에서 원가 개선</span>'
      + '</div>' + scatterSVG(ss)
      + '<div class="cap">가로=투찰 실행율, 세로=준공추정 실행율. 오른쪽·위로 갈수록 원가율 높음(불리). 점선 아래=투찰 대비 개선된 현장.</div></div>';
  // 유형 그룹
  ORDER[CUR].forEach(typ=>{
    const g=ss.filter(s=>s.유형===typ);
    if(!g.length) return;
    g.sort((a,b)=>(b.준공율==null?-999:b.준공율)-(a.준공율==null?-999:a.준공율));
    const ga=agg(g,"_도A","_실A"), gb=agg(g,"_도B","_실B"), gp=agg(g.filter(s=>s.사업계획율!=null),"_기성","_원가");
    html+='<div class="group"><div class="ghead"><span class="caret">▼</span><span class="gname">'+typ+'</span><span class="gn">'+g.length+'개</span>'
        + '<span class="gagg">집계 투찰<b>'+fmt(ga)+'</b><span>계획<b class="plan-v">'+fmt(gp)+'</b></span><span>준공<b class="rate '+lvl(gb)+'">'+fmt(gb)+'</b></span></span></div>'
        + '<table><thead><tr><th class="l">현장명</th><th>투찰</th><th>사업계획</th><th>준공추정</th><th>Δ 준공−투찰</th><th class="hide">계획비</th></tr></thead><tbody>';
    g.forEach(s=>{
      const dba = (s.준공율!=null&&s.투찰율!=null)? s.준공율-s.투찰율 : null;
      const gap = (s.준공율!=null&&s.사업계획율!=null)? s.준공율-s.사업계획율 : null;
      const isNew = s.사업계획율==null;
      html+='<tr><td class="name">'+s.현장명+(isNew?'<span class="badge-new">신규수주</span>':'')+'</td>'
          + '<td class="rate '+lvl(s.투찰율)+'">'+fmt(s.투찰율)+'</td>'
          + '<td>'+(isNew?'<span class="blank">—</span>':'<span class="plan-v">'+fmt(s.사업계획율)+'</span>')+'</td>'
          + '<td class="rate '+lvl(s.준공율)+'">'+fmt(s.준공율)+'</td>'
          + '<td>'+deltaCell(dba)+'</td>'
          + '<td class="hide">'+(gap==null?'<span class="blank">—</span>':'<span class="gap-sub">'+(gap>0?"+":"")+gap.toFixed(1)+'p</span>')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  });
  body.innerHTML=html;
  body.querySelectorAll(".ghead").forEach(h=>h.addEventListener("click",()=>{ h.parentNode.classList.toggle("collapsed"); postH(); }));
  postH();
}
function postH(){
  try{
    requestAnimationFrame(function(){
      var hh=Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      if(window.parent!==window && hh>200) window.parent.postMessage({__silhaeng:1, h:hh}, "*");
    });
  }catch(e){}
}
window.addEventListener("load", ()=>{ postH(); setTimeout(postH,300); setTimeout(postH,800); });
window.addEventListener("message", (e)=>{ try{ const s=e.data&&e.data.__silhaengSector; if(s==="인프라"||s==="건축"){ CUR=s; render(); } }catch(err){} });
render();
</script></body></html>
