<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공정 진행 준수율 대시보드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #2b3733;
    --panel: #313d38;
    --panel-2: #242e2b;
    --line: rgba(170, 185, 177, 0.16);
    --text: #f0f4f2;
    --muted: #aab9b1;
    --blue: #6fb3e8;
    --amber: #ffad42;
    --rust: #ff8f7a;
    --teal: #a8d480;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 14px 16px 32px;
  }
  .page { max-width: 900px; margin: 0 auto; }

  .panel {
    background: linear-gradient(155deg, #35423e, #27322e);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 6px 6px 18px rgba(0,0,0,0.35), -4px -4px 10px rgba(255,255,255,0.02);
    border-radius: 6px;
  }

  .panel-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .cover-title { font-size: 20px; font-weight: 900; margin: 0 0 3px; letter-spacing: -0.01em; }
  .cover-sub { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

  .total-panel { padding: 12px 14px 8px; margin-bottom: 10px; overflow: visible; }
  .panel-note { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

  .section-title {
    font-size: 13px; font-weight: 700; margin: 2px 0 6px;
    padding-left: 8px; border-left: 3px solid var(--blue);
  }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .stat-card { padding: 8px 10px; text-align: center; border-top: 3px solid var(--blue); }
  .stat-card.accent-severe { border-top-color: var(--rust); }
  .stat-card.accent-caution { border-top-color: var(--amber); }
  .stat-card.accent-normal { border-top-color: var(--teal); }
  .stat-num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .dist-bar { display: flex; height: 6px; overflow: hidden; border-radius: 4px; margin-bottom: 10px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5); }
  .seg-severe { background: var(--rust); }
  .seg-caution { background: var(--amber); }
  .seg-normal { background: var(--teal); }

  .action-plan-panel { padding: 10px 14px; margin-bottom: 10px; border-left: 4px solid var(--muted); }
  .action-plan-panel.ap-severe { border-left-color: var(--rust); }
  .action-plan-panel.ap-caution { border-left-color: var(--amber); }
  .action-plan-panel.ap-normal { border-left-color: var(--teal); }
  .ap-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ap-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
  .ap-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 4px; border: 1px solid currentColor;
  }
  .ap-badge-severe { color: var(--rust); }
  .ap-badge-caution { color: var(--amber); }
  .ap-badge-normal { color: var(--teal); }
  .ap-list { margin: 0 0 10px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .ap-list li { font-size: 13px; line-height: 1.5; }
  .ap-note { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .ap-flow-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 2px 0 8px; }
  .flow-tracks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .flow-track { background: #242e2b; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 8px 10px; }
  .flow-track-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
  .flow-diagram { display: flex; align-items: stretch; gap: 4px; flex-wrap: wrap; }
  .flow-step {
    flex: 1; min-width: 120px; background: #35423e; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px; padding: 6px 8px; box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
  }
  .flow-step-name { font-size: 11px; font-weight: 700; color: var(--text); margin-bottom: 4px; white-space: nowrap; }
  .flow-step-roles { display: flex; gap: 6px; flex-wrap: nowrap; }
  .flow-step-role { font-size: 9px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-role-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700;
    padding: 0px 4px; border-radius: 3px; flex-shrink: 0;
  }
  .flow-role-tag.main { background: rgba(56,194,165,0.18); color: var(--teal); }
  .flow-role-tag.support { background: rgba(79,168,216,0.18); color: var(--blue); }
  .flow-arrow { display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); padding: 0; }

  .flow-step-action {
    flex: 1.3; min-width: 150px; text-align: left; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .flow-step-action.ok { border-color: rgba(56,194,165,0.4); background: rgba(56,194,165,0.1); }
  .flow-step-action.bad { border-color: rgba(225,82,82,0.45); background: rgba(225,82,82,0.12); }
  .flow-step-action.placeholder { cursor: default; opacity: 0.75; }
  .flow-step-action .flow-step-name { white-space: normal; font-size: 11px; }
  .flow-step-cta { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; color: var(--blue); }
  .flow-step-cta.muted { color: var(--muted); }
  .flow-step-action.bad .flow-step-cta { color: var(--rust); }
  .flow-step-action.ok .flow-step-cta { color: var(--teal); }

  .countermeasure-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; color: var(--amber);
    background: rgba(240,169,78,0.1); border: 1px solid rgba(240,169,78,0.4);
    border-radius: 6px; padding: 9px 14px; cursor: pointer; margin-top: 2px;
  }
  .countermeasure-btn:hover { background: rgba(240,169,78,0.18); }
  .cm-extra-note {
    margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--rust);
    background: rgba(225,82,82,0.1); border: 1px solid rgba(225,82,82,0.35);
    border-radius: 4px; padding: 7px 12px;
  }

  .cm-panel { padding: 20px 22px; margin-bottom: 20px; }
  .cm-field { margin-bottom: 18px; }
  .cm-field:last-child { margin-bottom: 0; }
  .cm-label { display: block; font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
  .cm-textarea {
    width: 100%; min-height: 90px; resize: vertical; font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
    color: var(--text); background: #242e2b; border: 1px solid rgba(255,255,255,0.12); border-radius: 4px;
    padding: 10px 12px; line-height: 1.5;
  }
  .cm-textarea:focus { outline: none; border-color: var(--blue); }


  .ap-columns { display: flex; flex-direction: column; gap: 14px; }
  .ap-col { background: #242e2b; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 14px 16px; }
  .ap-col-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; color: var(--teal); margin-bottom: 8px; }
  .ap-col .ap-list { margin: 0; padding-left: 16px; }
  .ap-col-empty { font-size: 12px; color: var(--muted); }
  .ap-col-wide { grid-column: 1 / -1; }

  .cp-section { margin-top: 4px; }
  .cp-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .cp-card { background: #242e2b; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; box-shadow: 3px 3px 10px rgba(0,0,0,0.4); }
  .cp-card-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #35423e; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .cp-name-input {
    flex: 1; background: transparent; border: none; border-bottom: 1px dashed transparent;
    color: var(--text); font-size: 14px; font-weight: 700; padding: 4px 2px;
  }
  .cp-name-input:hover, .cp-name-input:focus { border-bottom-color: var(--blue); outline: none; }
  .cp-del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  .cp-del-btn:hover { color: var(--rust); }

  .cp-table-scroll { overflow-x: auto; }
  .cp-table { border-collapse: collapse; font-size: 8px; width: 100%; table-layout: fixed; }
  .cp-col-label { width: 68px; }
  .cp-col-week { width: auto; }
  .cp-table th, .cp-table td { text-align: center; padding: 2px 0; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }

  /* 월과 월 사이 경계선을 두껍고 밝은 색으로 강조 */
  .cp-table thead tr:first-child th:nth-child(n+2) { border-left: 2px solid var(--blue); }
  .cp-table thead tr:last-child th:nth-child(4n+1) { border-left: 2px solid var(--blue); }
  .cp-table tbody tr:not(.cp-team-divider) td:nth-child(4n+2) { border-left: 2px solid var(--blue); }
  .cp-table thead th { background: #35423e; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 8px; }
  .cp-label-th { color: var(--muted); }
  .cp-item-label { font-size: 10px; color: var(--text); font-weight: 600; white-space: nowrap; text-align: left; padding-left: 6px !important; background: #313d38; }
  .cp-team-divider td { background: #3c4b46; text-align: left; padding: 5px 8px !important; font-size: 11px; color: #ffffff; font-weight: 700; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.04em; }
  .cp-cell { padding: 1px !important; background: #2b3733; }
  .cp-toggle-cell {
    width: 100%; aspect-ratio: 1 / 1; max-width: 15px; max-height: 15px; border-radius: 2px; cursor: pointer; padding: 0;
    background: #35423e; border: 1px solid rgba(255,255,255,0.15);
    transition: background 0.1s ease, box-shadow 0.1s ease;
  }
  .cp-toggle-cell:hover { border-color: var(--blue); }
  .cp-toggle-cell.team-construction.on { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 6px rgba(168,212,128,0.7); }
  .cp-toggle-cell.team-procurement.on { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 6px rgba(111,179,232,0.7); }

  .cp-add-btn {
    font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700;
    background: #35423e; color: var(--blue); border: 1px dashed rgba(111,179,232,0.5);
    border-radius: 4px; padding: 9px 14px; cursor: pointer; width: 100%;
  }
  .cp-add-btn:hover { background: rgba(111,179,232,0.15); }

  .cp-delay-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 10px; white-space: nowrap; border: 1px solid currentColor;
  }
  .cp-delay-ok { color: var(--teal); }
  .cp-delay-bad { color: var(--rust); background: rgba(255,143,122,0.12); }
  .cp-delay-missing { color: var(--amber); background: rgba(255,173,66,0.12); }

  .cp-delay-summary {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 10px 16px; border-radius: 4px; margin-bottom: 20px; text-align: center;
    width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .cp-delay-summary.ok { color: var(--teal); background: rgba(168,212,128,0.1); border: 1px solid rgba(168,212,128,0.3); }
  .cp-delay-summary.bad { color: var(--rust); background: rgba(255,143,122,0.14); border: 1px solid rgba(255,143,122,0.4); }
  .cp-delay-summary:hover { filter: brightness(1.15); }
  .cp-delay-arrow { font-family: 'Noto Sans KR', sans-serif; }

  .delay-list-panel { padding: 8px; margin-bottom: 20px; }
  .delay-list { display: flex; flex-direction: column; gap: 8px; }
  .delay-row {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(155deg, #35423e, #27322e);
    border: 1px solid rgba(255,255,255,0.05); border-left: 4px solid var(--rust);
    box-shadow: 6px 6px 14px rgba(0,0,0,0.5), -4px -4px 10px rgba(255,255,255,0.02);
    border-radius: 4px; padding: 12px 14px; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .delay-row:hover { transform: translate(2px, -2px); box-shadow: 8px 10px 18px rgba(0,0,0,0.6), -4px -4px 10px rgba(255,255,255,0.03); }
  .delay-days-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; color: var(--rust);
    background: rgba(225,82,82,0.14); border: 1px solid rgba(225,82,82,0.4);
    padding: 4px 10px; border-radius: 4px; white-space: nowrap;
  }
  .delay-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .delay-site { font-size: 14px; font-weight: 600; }
  .delay-cp { font-size: 12px; color: var(--muted); }

  .sector-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .sector-tab {
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600;
    background: linear-gradient(155deg, #242e2b, #1a221f);
    border: 1px solid rgba(255,255,255,0.08); color: var(--muted);
    box-shadow: 4px 4px 10px rgba(0,0,0,0.5), -3px -3px 8px rgba(255,255,255,0.02);
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sector-tab.active { color: var(--text); border-color: var(--blue); box-shadow: inset 2px 2px 6px rgba(0,0,0,0.5); }
  .tab-count {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 10px;
  }
  .sector-tab.active .tab-count { background: var(--blue); color: #0a1420; }
  .empty-note { font-size: 13px; color: var(--muted); padding: 20px; text-align: center; }

  .guide-tag { font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: var(--blue); margin-left: 3px; font-weight: 700; }
  .cp-guide-cell { box-shadow: inset 0 0 0 1px var(--blue); background: rgba(111,179,232,0.08) !important; }
  .ap-col-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .cp-stat-summary { font-size: 11.5px; color: var(--text); background: rgba(111,179,232,0.12); border: 1px solid rgba(111,179,232,0.3); padding: 3px 10px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; }
  .cp-stat-summary strong { color: var(--teal); font-size: 13px; }
  .cp-filter-bar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; background: #313d38; padding: 8px 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }
  .cp-filter-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .cp-filter-select { background: #242e2b; color: var(--text); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; padding: 4px 8px; font-size: 11.5px; }
  .cp-header-main { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
  .cp-header-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .cp-meta-select { background: #242e2b; color: var(--text); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; padding: 3px 6px; font-size: 11px; }
  .cp-cls-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; color: var(--amber); background: rgba(255,173,66,0.12); border: 1px solid rgba(255,173,66,0.3); padding: 2px 6px; border-radius: 3px; }
  .cp-target-label { font-size: 11px; color: var(--blue); font-weight: 600; }
  .cp-history-box { font-size: 10.5px; color: var(--muted); background: #242e2b; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 5px 12px; overflow-x: auto; white-space: nowrap; }
  .cp-hist-title { font-weight: 700; color: var(--blue); }
  .hist-item { color: var(--rust); }

  .master-guideline-panel { background: #1b2420; border: 1px solid rgba(168,212,128,0.25); border-radius: 6px; padding: 12px; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0,0,0,0.4); }
  .master-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .master-title { font-size: 14px; font-weight: 700; color: var(--teal); letter-spacing: -0.01em; }
  .master-add-btn { width: auto !important; padding: 6px 14px !important; margin: 0 !important; font-size: 12px !important; }

  .cp-card-header-v2 { padding: 12px 14px; background: #2a3531; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px; }
  .cp-title-row { display: flex; align-items: center; gap: 8px; }
  .cp-drag-handle { color: var(--muted); cursor: pointer; font-size: 14px; }
  .cp-delay-badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .cp-delay-badge-orange { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: #ffad42; background: rgba(255,173,66,0.12); border: 1px solid rgba(255,173,66,0.5); padding: 3px 10px; border-radius: 12px; }
  .cp-meta-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 4px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08); }
  .cp-save-btn { background: #3182ce; color: #ffffff; border: none; padding: 5px 14px; border-radius: 4px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .cp-save-btn:hover { background: #2b6cb0; }

  /* Modal Overlay & Dialog */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .modal-dialog { background: #242e2b; border: 1px solid rgba(168,212,128,0.3); border-radius: 8px; width: 720px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--teal); }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: var(--rust); }
  .dday-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 12px; }
  .dday-table th, .dday-table td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
  .dday-table th { background: #1e2622; color: var(--teal); font-weight: 700; }
  .dday-input { width: 60px; background: #1a221f; border: 1px solid rgba(255,255,255,0.15); color: var(--text); padding: 4px; border-radius: 3px; text-align: center; font-family: 'IBM Plex Mono', monospace; }



  .list-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--muted); letter-spacing: 0.08em;
    margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 8px;
  }
  .list-head-row {
    display: grid; grid-template-columns: 32px 1fr 180px 110px 96px; gap: 12px;
    font-size: 11px; color: var(--muted); padding: 0 14px; margin-bottom: 6px;
  }
  .col-mini, .col-gap { text-align: right; }
  .site-list { display: flex; flex-direction: column; gap: 8px; }

  .site-row {
    display: grid; grid-template-columns: 32px 1fr 180px 110px 96px; align-items: center; gap: 12px;
    background: linear-gradient(155deg, #242e2b, #1a221f);
    border: 1px solid rgba(255,255,255,0.05);
    border-left: 4px solid var(--muted);
    box-shadow: 6px 6px 14px rgba(0,0,0,0.5), -4px -4px 10px rgba(255,255,255,0.02);
    border-radius: 4px;
    padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .site-row:hover { transform: translate(2px, -2px); box-shadow: 8px 10px 18px rgba(0,0,0,0.6), -4px -4px 10px rgba(255,255,255,0.03); }
  .site-row.status-severe { border-left-color: var(--rust); }
  .site-row.status-caution { border-left-color: var(--amber); }
  .site-row.status-normal { border-left-color: var(--teal); }

  .move-btn {

function setReviewMonth(idx) { REVIEW_IDX = idx; REVIEW_MONTH = MONTHS[idx]; }

function sumTo(arr, n) { return arr.slice(0, n).reduce((a, b) => a + b, 0); }
function classifyStage(site) { return sumTo(site.actualMonths, REVIEW_IDX + 1) > 0 ? "ongoing" : "new"; }
function classify(gapPct) {
  // 달성률 기준: 100% 이상 정상, 90~100% 미만 주의, 90% 미만 경보
  if (gapPct > 10) return { key: "severe", label: "경보" };
  if (gapPct > 0) return { key: "caution", label: "주의" };
  return { key: "normal", label: "정상" };
}
function siteStats(s) {
  const planToDate = sumTo(s.planMonths, REVIEW_IDX + 1);
  const actualToDate = sumTo(s.actualMonths, REVIEW_IDX + 1);
  const targetToDate = sumTo(s.targetMonths, REVIEW_IDX + 1);
  const gapPct = planToDate > 0 ? Math.round(100 - (actualToDate / planToDate) * 100) : 0;
  const planAnnual = s.planAnnual || 1;
  return {
    planToDate, actualToDate, targetToDate, gapPct,
    reviewLinePct: Math.round((planToDate / planAnnual) * 100),
    actualRel: Math.round((actualToDate / planAnnual) * 100),
    actualForecastRel: Math.round((s.actualAnnual / planAnnual) * 100),
    targetRel: Math.round((targetToDate / planAnnual) * 100),
    targetForecastRel: Math.round((s.targetAnnual / planAnnual) * 100),
    // 1~조회월 누계 계획 대비 달성률 (말풍선용)
    actualAchieveToDate: planToDate > 0 ? Math.round((actualToDate / planToDate) * 100) : 0,
    targetAchieveToDate: planToDate > 0 ? Math.round((targetToDate / planToDate) * 100) : 0,
  };
}
function totalStatsOf(total) {
  const gapPct = total.planToDate > 0 ? Math.round(100 - (total.actualToDate / total.planToDate) * 100) : 0;
  return {
    gapPct, status: classify(gapPct),
    reviewLinePct: Math.round((total.planToDate / total.planAnnual) * 100),
    actualRel: Math.round((total.actualToDate / total.planAnnual) * 100),
    actualForecastRel: Math.round((total.actualAnnual / total.planAnnual) * 100),
    targetRel: Math.round((total.targetToDate / total.planAnnual) * 100),
    targetForecastRel: Math.round((total.targetAnnual / total.planAnnual) * 100),
    actualAchieveToDate: total.planToDate > 0 ? Math.round((total.actualToDate / total.planToDate) * 100) : 0,
    targetAchieveToDate: total.planToDate > 0 ? Math.round((total.targetToDate / total.planToDate) * 100) : 0,
  };
}
function achvStatusOf(pct) {

function blank48() { return new Array(48).fill(false); }

function makeCP(itemData) {
  const isObj = typeof itemData === "object";
  const name = isObj ? itemData.name : itemData;
  const erpCode = isObj ? (itemData.erp || "E02A") : "E02A";
  const bld = isObj ? (itemData.bld || "공통") : "공통";
  const startW = isObj ? (itemData.startW != null ? itemData.startW : 24) : 24;
  const isCustom = isObj ? (itemData.isCustom || false) : false;

  return {
    id: `cp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    name,
    erpCode,
    buildingGroup: bld,
    targetStartWeek: startW,
    isCustom,
    construction: {
      budgetSubmit: blank48(),
      budgetApproved: blank48(),
      order: blank48(),
      startReq: blank48(),
    },
    support: {
      budgetForecast: blank48(),
    },
    procurement: {
      vendorPlan: blank48(),
    },
    history: [],
  };
}

function getERPInfo(code) {
  return ERP_CATEGORIES.find((c) => c.code === code) || ERP_CATEGORIES[1];
}

function calculateGuidelineWeek(cp, itemKey) {
  if (cp.isCustom) return -1;
  const master = ddayMasterStore.find((m) => m.erp === cp.erpCode) || ddayMasterStore[1];
  const ddays = master ? master.dday : { budgetSubmit: 60, budgetApproved: 45, order: 30, vendorPlan: 15 };
  const daysOffset = ddays[itemKey] || 30;
  const weeksOffset = Math.round(daysOffset / 7);
  const w = cp.targetStartWeek - weeksOffset;
  return Math.max(0, Math.min(47, w));
}

function applyGuidelineAutoFill(cp) {
  if (cp.isCustom) return;
  const items = [
    { team: "construction", item: "budgetSubmit" },
    { team: "construction", item: "budgetApproved" },
    { team: "construction", item: "order" },
    { team: "construction", item: "startReq" },
    { team: "support", item: "budgetForecast" },
    { team: "procurement", item: "vendorPlan" },
  ];
  items.forEach(({ team, item }) => {
    if (cp[team] && cp[team][item]) {
      cp[team][item].fill(false);
      const w = item === "startReq" ? cp.targetStartWeek : calculateGuidelineWeek(cp, item);
      if (w >= 0 && w < 48) cp[team][item][w] = true;
    }
  });
}

function ensureCPData(divKey, siteId) {
  if (!cpStore[divKey]) cpStore[divKey] = {};
  if (!cpStore[divKey][siteId]) {
    cpStore[divKey][siteId] = DEFAULT_CP_ITEMS.map((item) => {
      const cp = makeCP(item);
      applyGuidelineAutoFill(cp);
      return cp;
    });
  }
  return cpStore[divKey][siteId];
}

function ensureCPFilter(divKey, siteId) {
  if (!cpFilterStore[divKey]) cpFilterStore[divKey] = {};
  if (!cpFilterStore[divKey][siteId]) {
    cpFilterStore[divKey][siteId] = { bld: "all", erp: "all" };
  }
  return cpFilterStore[divKey][siteId];
}

}

function lastCheckedWeek(arr) {
  if (!arr) return -1;
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i]) return i;
  return -1;
}

function currentWeekIdx() { return REVIEW_IDX * 4 + 3; }

function cpDelayInfo(cp) {
  const orderW = lastCheckedWeek(cp.construction.order);
  const vendorW = lastCheckedWeek(cp.procurement.vendorPlan);
  if (orderW === -1 || vendorW === -1) {
    return { state: "missing", days: 0, text: "계획 수립 중" };
  }
  const days = vendorW - orderW > 0 ? (vendorW - orderW) * 7 : 0;
  return days > 0 ? { state: "bad", days, text: `${days}일 지연` } : { state: "ok", days: 0, text: "정상" };
}

function cpGuidelineCompliance(cp) {
  if (cp.isCustom) return { isChecked: false, isCompliant: true, diff: 0 };
  const vendorW = lastCheckedWeek(cp.procurement.vendorPlan);
  const targetW = calculateGuidelineWeek(cp, "vendorPlan");
  if (vendorW === -1) return { isChecked: false, isCompliant: true, diff: 0 };
  const diff = vendorW - targetW;
  return { isChecked: true, isCompliant: diff <= 0, diff };
}

function computeGuidelineComplianceStats(divKey, siteId) {
  const cps = ensureCPData(divKey, siteId);
  let checkedCount = 0, compliantCount = 0, deviatedCount = 0;
  cps.forEach((cp) => {
    const res = cpGuidelineCompliance(cp);
    if (res.isChecked) {
      checkedCount++;
      if (res.isCompliant) compliantCount++;
      else deviatedCount++;
    }
  });
  const rate = checkedCount > 0 ? Math.round((compliantCount / checkedCount) * 100) : 100;
  return { total: cps.length, checkedCount, compliantCount, deviatedCount, rate };
}

// ── 엑셀 파싱 (계획/실적추정/추진목표 공통 구조) ──────────────────────
function findColIndex(headerRow, label) {
  for (let i = 0; i < headerRow.length; i++) {
    if (headerRow[i] === label) return i;
  }
  return -1;
}
async function readWorkbookRows(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: 0, raw: true });
}
function parseFileRows(rows) {
  const header1 = rows[0] || [];
  const header2 = rows[1] || [];
  const nameIdx = findColIndex(header1, "현장명");
  const periodIdx = findColIndex(header1, "공사기간");
  const annualIdx = findColIndex(header1, "2026합계");
  const sitecdIdx = findColIndex(header1, "현장코드");
  const monthIdx = {};
  for (let m = 1; m <= 12; m++) monthIdx[m] = findColIndex(header2, `${m}월`);
  const data = {};
  for (let r = 2; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const name = row[nameIdx];
    const sitecd = row[sitecdIdx];
    if (!name || !sitecd) continue; // 소계/합계 등 빈 코드 행 제외
    const months = [];
    for (let m = 1; m <= 12; m++) months.push(Number(row[monthIdx[m]]) || 0);
    data[sitecd] = {
      name: String(name),
      period: header1[periodIdx] != null ? String(row[periodIdx] || "") : "",
      annual: Number(row[annualIdx]) || 0,
      months,
    };
  }
  return data;
}
async function extractSitesFromFiles(planFile, actualFile, targetFile) {
  const [planRows, actualRows, targetRows] = await Promise.all([
    readWorkbookRows(planFile), readWorkbookRows(actualFile), readWorkbookRows(targetFile),
  ]);
  const plan = parseFileRows(planRows);
  const actual = parseFileRows(actualRows);
  const target = parseFileRows(targetRows);
  const active = Object.keys(plan).filter((k) => plan[k].annual > 0);
  const common = active.filter((k) => actual[k] && target[k]);
  if (common.length === 0) {
    throw new Error("세 파일에서 공통으로 매칭되는 현장을 찾지 못했습니다. 파일 형식(현장코드, 2026합계, 월별 컬럼)을 확인해주세요.");
  }
  const sites = common.map((k) => ({
    id: k, name: plan[k].name, period: plan[k].period,
    planAnnual: plan[k].annual, planMonths: plan[k].months,
    actualAnnual: actual[k].annual, actualMonths: actual[k].months,
    targetAnnual: target[k].annual, targetMonths: target[k].months,
  }));
  return { sites, total: computeTotal(sites) };
}

let trendGeom = null; // 호버 툴팁 계산용 현재 차트 기하정보

function trendChartSVG(site) {
  const planCum = [], actualCum = [], targetCum = [];
  let ps = 0, as = 0, ts = 0;
  for (let i = 0; i < 12; i++) {
    ps += site.planMonths[i]; as += site.actualMonths[i]; ts += site.targetMonths[i];
    planCum.push(ps); actualCum.push(as); targetCum.push(ts);
  }
  const actualSolid = actualCum.slice(0, REVIEW_IDX + 1);
  const actualForecast = actualCum.slice(REVIEW_IDX);

  const w = 600, h = 210, padL = 52, padT = 18, padB = 26, padR = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = MONTHS.length;
  const x = (i) => padL + (i * plotW) / (n - 1);
  const maxVal = Math.max(...planCum, ...actualCum, ...targetCum, 1);
  const domainMax = maxVal * 1.15;
  const y = (v) => padT + plotH - (Math.min(v, domainMax) / domainMax) * plotH;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((r) => domainMax * r);

  const planPts = planCum.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const actualSolidPts = actualSolid.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const actualForecastPts = actualForecast.map((v, i) => `${x(i + REVIEW_IDX)},${y(v)}`).join(" ");
  const targetPts = targetCum.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const nowX = x(REVIEW_IDX);
  const lastIdx = n - 1;

  let gridSvg = ticks.map(g => `<g><line x1="${padL}" x2="${w - padR}" y1="${y(g)}" y2="${y(g)}" class="trend-grid"/><text x="${padL - 8}" y="${y(g) + 3}" class="trend-axis-label" text-anchor="end">${fmtEok(g, 0)}</text></g>`).join("");
  let monthSvg = MONTHS.map((m, i) => `<text x="${x(i)}" y="${h - 6}" class="trend-axis-label" text-anchor="middle">${m}</text>`).join("");

  // 12월 끝점 라벨: 계획 → 실적추정 → 추진목표 고정 순서, 겹치지 않도록 최소 간격만 확보
  let endItems = [
    { label: "계획", value: planCum[lastIdx], y: y(planCum[lastIdx]), cls: "trend-end-plan" },
    { label: "실적추정", value: actualCum[lastIdx], y: y(actualCum[lastIdx]), cls: "trend-end-actual-forecast" },
    { label: "추진목표", value: targetCum[lastIdx], y: y(targetCum[lastIdx]), cls: "trend-end-target" },
  ];
  const minGap = 13;
  for (let i = 1; i < endItems.length; i++) {
    if (endItems[i].y - endItems[i - 1].y < minGap) endItems[i].y = endItems[i - 1].y + minGap;
  }
  const endLabelsSvg = endItems.map((it) =>
    `<text x="${x(lastIdx) - 8}" y="${it.y + 3}" class="trend-end-label ${it.cls}" text-anchor="end">${it.label} ${fmtEok(it.value, 1)}</text>`
  ).join("");

  trendGeom = { w, h, padL, padR, plotW, plotH, padT, n, planCum, actualCum, targetCum };

  const svg = `<svg viewBox="0 0 ${w} ${h}" class="trend-svg">
    ${gridSvg}${monthSvg}
    <line x1="${nowX}" x2="${nowX}" y1="${padT}" y2="${padT + plotH}" class="trend-now-line"/>
    <text x="${nowX}" y="${padT - 6}" class="trend-now-label" text-anchor="middle">현재(${REVIEW_MONTH})</text>
    <polyline points="${targetPts}" class="trend-line trend-line-target"/>
    <polyline points="${planPts}" class="trend-line trend-line-plan"/>
    <polyline points="${actualForecastPts}" class="trend-line trend-line-actual-forecast"/>
    <polyline points="${actualSolidPts}" class="trend-line trend-line-actual"/>
    ${endLabelsSvg}
  </svg>`;

  return `<div class="trend-chart-wrap">
    ${svg}
    <div class="trend-hover-line" id="trend-hover-line"></div>
    <div class="trend-tooltip" id="trend-tooltip"></div>
  </div>`;
}

function getSorted(div) { return [...div.sites].sort((a, b) => siteStats(b).gapPct - siteStats(a).gapPct); }
function getSummary(div) {

  const caution = div.sites.filter((x) => { const g = siteStats(x).gapPct; return g > 0 && g <= 10; }).length;

}

}

function render() {
  const app = document.getElementById("app");
  const div = currentDiv();
  let body;
  if (div.view === "detail" && div.selectedId) {
    const site = div.sites.find((s) => s.id === div.selectedId);
    body = site ? detailPageHTML(div, site) : listPageHTML(div);
  } else if (div.view === "delay") {
    body = delayListPageHTML(div);
  } else if (div.view === "countermeasure") {
    body = countermeasurePageHTML(div);
  } else if (div.sites.length === 0) {
    body = emptyDivisionHTML(div);
  } else {
    body = listPageHTML(div);
  }
  app.innerHTML = monthSelectorHTML() + body;
}

async function persistDivision(key) {
  try {
    if (window.storage) {
      const d = divisions[key];
      await window.storage.set(`division-${key}`, JSON.stringify({ sites: d.sites, total: d.total, overrides: d.overrides }));
    }
  } catch (e) { /* 저장 실패해도 화면 동작에는 지장 없음 */ }
}
async function loadAll() {
  try {
    if (window.storage) {
      for (const key of Object.keys(divisions)) {
        const res = await window.storage.get(`division-${key}`);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          if (saved.sites && saved.sites.length) divisions[key].sites = saved.sites;
          if (saved.total) divisions[key].total = saved.total;
          if (saved.overrides) divisions[key].overrides = saved.overrides;
        }
        const cpRes = await window.storage.get(`cp-data-${key}`);
        if (cpRes && cpRes.value) cpStore[key] = JSON.parse(cpRes.value);
        const cmRes = await window.storage.get(`countermeasure-${key}`);
        if (cmRes && cmRes.value) countermeasureNotes[key] = JSON.parse(cmRes.value);
      }
    }
  } catch (e) { /* 저장된 값 없음 - 기본값 사용 */ }
  render();
}

// ── 이벤트 처리 ──────────────────────────────────────────────
document.getElementById("app").addEventListener("click", function (e) {
  const divTab = e.target.closest(".division-tab");
  if (divTab) { state.activeDivision = divTab.dataset.division; render(); return; }

  const moveBtn = e.target.closest(".move-btn");
  if (moveBtn) {
    e.stopPropagation();
    currentDiv().overrides[moveBtn.dataset.id] = moveBtn.dataset.target;
    persistDivision(state.activeDivision);
    render();
    return;
  }
  const collapseToggle = e.target.closest("#list-collapse-toggle");
  if (collapseToggle) { currentDiv().listOpen = !currentDiv().listOpen; render(); return; }

  const uploadToggle = e.target.closest("#upload-collapse-toggle");
  if (uploadToggle) { currentDiv().uploadOpen = !currentDiv().uploadOpen; render(); return; }

  const cpToggleCell = e.target.closest(".cp-toggle-cell");
  if (cpToggleCell) {
    const cps = ensureCPData(cpToggleCell.dataset.division, cpToggleCell.dataset.site);
    const cp = cps.find((c) => c.id === cpToggleCell.dataset.cp);
    if (cp) {
      const group = cp[cpToggleCell.dataset.team];
      const arr = group && group[cpToggleCell.dataset.item];
      if (arr) {
        const w = Number(cpToggleCell.dataset.week);
        const wasOn = arr[w];
        arr.fill(false); // 항목당 체크는 한 개만 허용 - 같은 행의 기존 선택은 해제
        if (!wasOn) {
          arr[w] = true;
          const guideW = calculateGuidelineWeek(cp, cpToggleCell.dataset.item);
          const diffWeeks = w - guideW;
          if (diffWeeks !== 0) {
            const nowStr = new Date().toISOString().slice(5, 10);
            const itemLabels = { order: "발주", vendor: "업체선정", survey: "현설", bid: "입찰", contract: "계약" };
            const label = itemLabels[cpToggleCell.dataset.item] || cpToggleCell.dataset.item;
            if (!cp.history) cp.history = [];
            cp.history.unshift({ time: nowStr, itemLabel: label, week: w, diffWeeks });
          }
        }
      }
    }
    persistCPData(cpToggleCell.dataset.division);
    render(); // 같은 행의 다른 칸도 갱신되어야 하므로 재렌더링
    return;
  }
  const cpDelBtn = e.target.closest(".cp-del-btn");
  if (cpDelBtn) {
    const siteId = currentDiv().selectedId;
    const cps = ensureCPData(state.activeDivision, siteId);
    const idx = cps.findIndex((c) => c.id === cpDelBtn.dataset.cp);
    if (idx >= 0) cps.splice(idx, 1);
    persistCPData(state.activeDivision);
    render();
    return;
  }
  const openDDayBtn = e.target.closest("#btn-open-dday-modal");
  if (openDDayBtn) {
    isDDayModalOpen = true;
    render();
    return;
  }
  const closeDDayBtn = e.target.closest("#btn-close-dday-modal");
  if (closeDDayBtn) {
    isDDayModalOpen = false;
    render();
    return;
  }
  const saveDDayBtn = e.target.closest("#btn-save-dday-modal");
  if (saveDDayBtn) {
    const inputs = document.querySelectorAll(".dday-input");
    inputs.forEach((input) => {
      const idx = Number(input.dataset.idx);
      const field = input.dataset.field;
      const val = Number(input.value) || 0;
      if (ddayMasterStore[idx] && ddayMasterStore[idx].dday) {
        ddayMasterStore[idx].dday[field] = val;
      }
    });
    Object.keys(cpStore).forEach((divKey) => {
      Object.keys(cpStore[divKey]).forEach((siteId) => {
        cpStore[divKey][siteId].forEach((cp) => applyGuidelineAutoFill(cp));
      });
    });
    isDDayModalOpen = false;
    render();
    return;
  }
  const addDDayItemBtn = e.target.closest("#btn-add-dday-master-item");
  if (addDDayItemBtn) {
    const name = prompt("신규 가이드 공종명을 입력하세요 (예: 07. 조명/특수장비):");
    if (name) {
      const code = `E${Date.now()}`;
      ddayMasterStore.push({ erp: code, name, dday: { budgetSubmit: 60, budgetApproved: 45, budgetForecast: 45, order: 30, vendorPlan: 15 } });
      ERP_CATEGORIES.push({ code, name, cls: "자율" });
      render();
    }
    return;
  }
  const cpAutoApplyBtn = e.target.closest(".cp-save-btn");
  if (cpAutoApplyBtn) {
    const siteId = cpAutoApplyBtn.dataset.site;
    const cps = ensureCPData(state.activeDivision, siteId);
    const cp = cps.find((c) => c.id === cpAutoApplyBtn.dataset.cp);
    if (cp) {
      applyGuidelineAutoFill(cp);
      persistCPData(state.activeDivision);
      render();
    }
    return;
  }
  const addCustomBtn = e.target.closest("#btn-add-custom-cp");
  if (addCustomBtn) {
    const cps = ensureCPData(addCustomBtn.dataset.division, addCustomBtn.dataset.site);
    cps.push(makeCP({ name: "신규 자율 항목", erp: "E02A", bld: "공통", startW: 24, isCustom: true }));
    persistCPData(addCustomBtn.dataset.division);
    render();
    return;
  }
  const cpAddBtn = e.target.closest(".cp-add-btn");
  if (cpAddBtn) {
    const cps = ensureCPData(cpAddBtn.dataset.division, cpAddBtn.dataset.site);
    const newCP = makeCP({ name: "신규 표준 공종", erp: "E02A", bld: "공통", startW: 24, isCustom: false });
    applyGuidelineAutoFill(newCP);
    cps.push(newCP);
    persistCPData(cpAddBtn.dataset.division);
    render();
    return;
  }

  const stageTab = e.target.closest(".sector-tab");
  if (stageTab) { currentDiv().stage = stageTab.dataset.stage; render(); return; }

  const row = e.target.closest(".site-row");
  if (row) { currentDiv().selectedId = row.dataset.id; currentDiv().view = "detail"; render(); return; }

  const delaySummaryBtn = e.target.closest("#cp-delay-summary-btn");
  if (delaySummaryBtn) { currentDiv().view = "delay"; render(); return; }

  const delayRow = e.target.closest(".delay-row");
  if (delayRow) { currentDiv().selectedId = delayRow.dataset.site; currentDiv().view = "detail"; render(); return; }

  const countermeasureBtn = e.target.closest("#countermeasure-btn");
  if (countermeasureBtn) { currentDiv().view = "countermeasure"; render(); return; }

  const back = e.target.closest(".back-btn");
  if (back) { currentDiv().view = "list"; render(); return; }

  const applyBtn = e.target.closest(".upload-apply-btn");
  if (applyBtn) {
    const key = applyBtn.dataset.division;
    const picked = uploadPicked[key];
    const statusEl = document.getElementById(`upload-status-${key}`);
    if (!picked.plan || !picked.actual || !picked.target) return;
    applyBtn.disabled = true;
    statusEl.textContent = "엑셀 파일을 읽는 중...";
    statusEl.className = "upload-status";
    extractSitesFromFiles(picked.plan, picked.actual, picked.target)
      .then((result) => {
        divisions[key].sites = result.sites;
        divisions[key].total = result.total;
        divisions[key].overrides = {};
        divisions[key].view = "list";
        divisions[key].selectedId = null;
        divisions[key].uploadOpen = false;
        persistDivision(key);
        statusEl.textContent = `${result.sites.length}개 현장 데이터를 적용했습니다.`;
        statusEl.className = "upload-status ok";
        render();
      })
      .catch((err) => {
        statusEl.textContent = err.message || "파일을 읽는 중 오류가 발생했습니다.";
        statusEl.className = "upload-status error";
        applyBtn.disabled = false;
      });
    return;
  }
});

document.getElementById("app").addEventListener("change", function (e) {
  const monthSelect = e.target.closest("#review-month-select");
  if (monthSelect) {
    setReviewMonth(Number(monthSelect.value));
    render();
    return;
  }
  const filterBld = e.target.closest("#cp-filter-bld");
  if (filterBld) {
    const filter = ensureCPFilter(filterBld.dataset.division, filterBld.dataset.site);
    filter.bld = filterBld.value;
    render();
    return;
  }
  const filterErp = e.target.closest("#cp-filter-erp");
  if (filterErp) {
    const filter = ensureCPFilter(filterErp.dataset.division, filterErp.dataset.site);
    filter.erp = filterErp.value;
    render();
    return;
  }
  const metaSelect = e.target.closest(".cp-meta-select");
  if (metaSelect) {
    const cps = ensureCPData(state.activeDivision, metaSelect.dataset.site || currentDiv().selectedId);
    const cp = cps.find((c) => c.id === metaSelect.dataset.cp);
    if (cp) {
      const field = metaSelect.dataset.field;
      if (field === "targetStartWeek") {
        cp.targetStartWeek = Number(metaSelect.value);
        applyGuidelineAutoFill(cp);
      }
      else if (field === "erpCode") {
        cp.erpCode = metaSelect.value;
        applyGuidelineAutoFill(cp);
      }
      else if (field === "buildingGroup") cp.buildingGroup = metaSelect.value;
      persistCPData(state.activeDivision);
      render();
    }
    return;
  }
  const cpNameInput = e.target.closest(".cp-name-input");
  if (cpNameInput) {
    const cps = ensureCPData(state.activeDivision, currentDiv().selectedId);
    const cp = cps.find((c) => c.id === cpNameInput.dataset.cp);
    if (cp) cp.name = cpNameInput.value.trim() || cp.name;
    persistCPData(state.activeDivision);
    return; // 입력값은 이미 표시되어 있으므로 재렌더 불필요
  }
  const cmTextarea = e.target.closest(".cm-textarea");
  if (cmTextarea) {
    const notes = ensureCountermeasure(cmTextarea.dataset.division);
    notes[cmTextarea.dataset.team] = cmTextarea.value;
    persistCountermeasure(cmTextarea.dataset.division);
    return; // 입력값은 이미 표시되어 있으므로 재렌더 불필요
  }
  const input = e.target.closest('input[type="file"]');
  if (!input) return;
  const key = input.dataset.division;
  const kind = input.dataset.kind;
  const file = input.files && input.files[0];
  if (!file) return;
  uploadPicked[key][kind] = file;
  render();
});

document.addEventListener("mousemove", function (e) {
  const wrap = e.target.closest(".trend-chart-wrap");
  const tooltip = document.getElementById("trend-tooltip");
  const hoverLine = document.getElementById("trend-hover-line");
  if (!wrap || !trendGeom || !tooltip || !hoverLine) {
    if (tooltip) tooltip.style.display = "none";
    if (hoverLine) hoverLine.style.display = "none";
    return;
  }
  const svg = wrap.querySelector("svg");
  const rect = svg.getBoundingClientRect();
  const fracX = (e.clientX - rect.left) / rect.width;
  const svgX = fracX * trendGeom.w;
  const step = trendGeom.plotW / (trendGeom.n - 1);
  let i = Math.round((svgX - trendGeom.padL) / step);
  i = Math.max(0, Math.min(trendGeom.n - 1, i));
  const leftPct = ((trendGeom.padL + i * step) / trendGeom.w) * 100;
  const tooltipLeftPct = Math.min(85, Math.max(15, leftPct));

  hoverLine.style.display = "block";
  hoverLine.style.left = `${leftPct}%`;

  tooltip.style.display = "block";
  tooltip.style.left = `${tooltipLeftPct}%`;
  tooltip.innerHTML = `
    <div class="tt-month">${MONTHS[i]} 누계</div>
    <div class="tt-row"><span class="tt-dot" style="background:var(--blue)"></span>계획<b>${fmtEok(trendGeom.planCum[i], 1)}</b></div>
    <div class="tt-row"><span class="tt-dot" style="background:var(--teal)"></span>실적추정<b>${fmtEok(trendGeom.actualCum[i], 1)}</b></div>
    <div class="tt-row"><span class="tt-dot" style="background:var(--amber)"></span>추진목표<b>${fmtEok(trendGeom.targetCum[i], 1)}</b></div>
  `;
});

loadAll();
</script>
